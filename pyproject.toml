[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-twin"
version = "1.0.0"
description = "Battery digital twin: PyBaMM physics, empirical ageing from published data, TEA and LCA screening"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pybamm>=25.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "numpy-financial>=1.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.52", "plotly>=5.20"]   # 1.52: download data built on click
dev = ["pytest>=8.0", "streamlit>=1.52", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battery_twin = ["data/*.json", "data/*.csv", "data/kirkaldy2024/*.csv", "data/kirkaldy2024/*.md",
                "data/schneider2025/*.csv", "data/schneider2025/*.md",
                "data/schmitt2023/*.csv", "data/schmitt2023/*.md",
                "data/gray2026/*.csv", "data/gray2026/*.md",
                "data/gorsch2025/*.csv", "data/gorsch2025/*.md",
                "data/rucker2024/*.csv", "data/rucker2024/*.md",
                "data/bilfinger2025/*.csv", "data/bilfinger2025/*.md",
                "data/zhu2022/*.csv", "data/zhu2022/*.md",
                "data/wheeler2025/*.csv", "data/wheeler2025/*.md",
                "data/bahrke2026/*.csv", "data/bahrke2026/*.md",
                "data/yagci2025/*.csv", "data/yagci2025/*.md",
                "data/lam2024/*.csv", "data/lam2024/*.md",
                "_vendor/blast_lite/LICENSE", "_vendor/blast_lite/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
