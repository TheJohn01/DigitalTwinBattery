# Runs the test suite on GitHub every time files are uploaded (pushed) or a pull request is opened.
# Place this file at: .github/workflows/tests.yml
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its test tools
        run: pip install -r requirements.txt

      - name: Run the tests
        run: pytest -q
