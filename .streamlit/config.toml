# Frutiger Aero-style themes. Light: sky blue, aqua and fresh green on light glass.
# Dark ("Dark Aero"): night navy, cyan and teal glows on dark glass. The app follows the
# system setting; the user can switch in the menu (⋮ > Settings).
# The gradients, glass panels and glossy buttons are in assets/aero.css (loaded by app.py).
[theme.light]
primaryColor = "#1683cc"
backgroundColor = "#eef9ff"
secondaryBackgroundColor = "#dcf1fb"
textColor = "#0b2a3f"
linkColor = "#0f6fae"
blueColor = "#1683cc"
greenColor = "#3aa635"
borderColor = "#b9e2f5"
baseRadius = "large"
buttonRadius = "full"
showSidebarBorder = false

[theme.dark]
primaryColor = "#38c6ff"
backgroundColor = "#04121f"
secondaryBackgroundColor = "#0b2a40"
textColor = "#d8f1ff"
linkColor = "#6fd8ff"
blueColor = "#38c6ff"
greenColor = "#4fdc7a"
borderColor = "#1b4b66"
baseRadius = "large"
buttonRadius = "full"
showSidebarBorder = false
